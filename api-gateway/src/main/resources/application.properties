spring.application.name=api-gateway
server.port=9191
management.endpoints.web.exposure.include=*
eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/
# Routes for Employee Service
spring.cloud.gateway.routes[0].id=EMPLOYEE-SERVICE
spring.cloud.gateway.routes[0].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/employees/**
# Routes for Department Service
spring.cloud.gateway.routes[1].id=DEPARTMENT-SERVICE
spring.cloud.gateway.routes[1].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/departments/**
# Automatic route creation
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# Routes for Organization Service
spring.cloud.gateway.routes[2].id=ORGANIZATION-SERVICE
spring.cloud.gateway.routes[2].uri=lb://ORGANIZATION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/organizations/**
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true
#logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG

# Zipkin server configuration
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.org.springframework.web=DEBUG

# Retry filter for organization service [firstBackoff * (factor ^ n)]
spring.cloud.gateway.routes[2].filters[0].name= Retry
spring.cloud.gateway.routes[2].filters[0].args.retries= 3
spring.cloud.gateway.routes[2].filters[0].args.methods= GET
spring.cloud.gateway.routes[2].filters[0].args.backoff.firstBackoff= 100
spring.cloud.gateway.routes[2].filters[0].args.backoff.maxBackoff= 1000
spring.cloud.gateway.routes[2].filters[0].args.backoff.factor= 2
spring.cloud.gateway.routes[2].filters[0].args.backoff.basedOnPreviousValue= true

# Http timeout config
spring.cloud.gateway.httpclient.connect-timeout= 3000
spring.cloud.gateway.httpclient.response-timeout= 10s

# auth-server config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# Employee Service documentation
springdoc.swagger-ui.urls[0].name=Employee Service
springdoc.swagger-ui.urls[0].url=/employee/v3/api-docs

# Department Service documentation
springdoc.swagger-ui.urls[1].name=Department Service
springdoc.swagger-ui.urls[1].url=/department/v3/api-docs

# Organization Service documentation
springdoc.swagger-ui.urls[2].name=Organization Service
springdoc.swagger-ui.urls[2].url=/organization/v3/api-docs

springdoc.swagger-ui.urlsPrimaryName=Employee Service

# Employee OpenAPI
spring.cloud.gateway.routes[3].id=EMPLOYEE-OPENAPI
spring.cloud.gateway.routes[3].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/employee/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/employee/v3/api-docs, /v3/api-docs

# Department OpenAPI
spring.cloud.gateway.routes[4].id=DEPARTMENT-OPENAPI
spring.cloud.gateway.routes[4].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/department/v3/api-docs
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/department/v3/api-docs, /v3/api-docs

# Organization OpenAPI
spring.cloud.gateway.routes[5].id=ORGANIZATION-OPENAPI
spring.cloud.gateway.routes[5].uri=lb://ORGANIZATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/organization/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/organization/v3/api-docs, /v3/api-docs